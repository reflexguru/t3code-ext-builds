name: Build T3 Code + pull requests nightly (Windows)

# Builds the upstream nightly from source with Command Code (#10861) and
# Oh My Pi (#11973) layered on top, plus the local Command Code patches,
# and publishes a Windows NSIS installer.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build even if this nightly tag and pull request revisions were already recorded
        required: false
        default: false
        type: boolean
      pr_refs:
        description: Space separated upstream pull request refs to layer, in merge order
        required: false
        default: refs/pull/10861/head refs/pull/11973/head
        type: string

permissions:
  contents: write

concurrency:
  group: t3code-prs-windows-nightly
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-layered-windows.yml
    with:
      flavor: prs
      source_mode: merge
      test_kind: command-code
      pr_refs: ${{ inputs.pr_refs || 'refs/pull/10861/head refs/pull/11973/head' }}
      force: ${{ inputs.force || false }}
    secrets: inherit
