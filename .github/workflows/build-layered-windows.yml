name: Build layered T3 Code Windows nightly

# Reusable workflow. Callers pick the flavor, the pull request set, whether
# those pull requests merge onto the nightly tag or pin the first PR head,
# and which adapter tests to run.

on:
  workflow_call:
    inputs:
      flavor:
        required: true
        type: string
      pr_refs:
        required: true
        type: string
      source_mode:
        required: true
        type: string
      test_kind:
        required: true
        type: string
      force:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  T3CODE_REPO: pingdotgg/t3code
  T3CODE_CLERK_PUBLISHABLE_KEY: pk_live_Y2xlcmsudDMuY29kZXMk
  T3CODE_CLERK_JWT_TEMPLATE: t3-relay
  T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: hzxSgY2cH10sDU2r
  T3CODE_RELAY_URL: https://relay.t3.codes

jobs:
  resolve:
    name: Resolve the upstream nightly and pull request revisions
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
      version: ${{ steps.release.outputs.version }}
      pr_spec: ${{ steps.release.outputs.pr_spec }}
      key: ${{ steps.release.outputs.key }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Resolve versions
        id: release
        env:
          FLAVOR: ${{ inputs.flavor }}
          PR_REFS: ${{ inputs.pr_refs }}
          SOURCE_MODE: ${{ inputs.source_mode }}
          FORCE: ${{ inputs.force && 'true' || 'false' }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/resolve-build.sh

  build:
    name: Build the Windows installer
    needs: resolve
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      FLAVOR: ${{ inputs.flavor }}
      PR_REFS: ${{ inputs.pr_refs }}
      SOURCE_MODE: ${{ inputs.source_mode }}
      TEST_KIND: ${{ inputs.test_kind }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SHA: ${{ needs.resolve.outputs.sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      PR_SPEC: ${{ needs.resolve.outputs.pr_spec }}
    steps:
      - name: Use LF line endings and long paths
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
          git config --global core.longpaths true

      - name: Checkout this packaging repository
        uses: actions/checkout@v5

      - name: Checkout upstream T3 Code
        uses: actions/checkout@v5
        with:
          repository: ${{ env.T3CODE_REPO }}
          ref: ${{ inputs.source_mode == 'pin' && needs.resolve.outputs.sha || needs.resolve.outputs.tag }}
          path: .work/t3code
          fetch-depth: 0
          persist-credentials: false

      - name: Point scripts at the checkouts
        run: |
          repo_root="$(cygpath -u "$GITHUB_WORKSPACE" 2>/dev/null || printf '%s' "$GITHUB_WORKSPACE")"
          printf 'REPO_ROOT=%s\n' "$repo_root" >> "$GITHUB_ENV"
          printf 'T3CODE_SRC=%s\n' "$repo_root/.work/t3code" >> "$GITHUB_ENV"

      - name: Layer the pull requests on top
        if: inputs.source_mode == 'merge'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/layer-pull-requests.sh

      - name: Confirm the pinned orchestrator commit
        if: inputs.source_mode == 'pin'
        run: bash scripts/confirm-pinned-source.sh

      - name: Apply local patches
        run: bash scripts/apply-patches.sh

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: .work/t3code/package.json
          cache: false
          run-install: false

      - name: Resolve Windows package cache path
        id: package_cache_path
        shell: pwsh
        run: |
          Set-Location .work/t3code
          "path=$(vp pm cache dir)" >> $env:GITHUB_OUTPUT

      - name: Cache Windows packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.package_cache_path.outputs.path }}
          key: windows-packages-v1-x64-${{ hashFiles('.work/t3code/package.json', '.work/t3code/pnpm-lock.yaml', '.work/t3code/vp.lock') }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install Spectre-mitigated MSVC libs
        shell: pwsh
        run: ./scripts/install-spectre-msvc.ps1 -Arch x64

      - name: Install dependencies
        working-directory: .work/t3code
        run: |
          vp install \
            --filter=t3... \
            --filter=@t3tools/web... \
            --filter=@t3tools/desktop... \
            --filter=@t3tools/scripts...

      - name: Test the Command Code adapter
        run: bash scripts/test-command-code.sh

      - name: Align package versions
        working-directory: .work/t3code
        run: node scripts/update-release-package-versions.ts "${{ needs.resolve.outputs.version }}"

      - name: Build desktop pipeline
        working-directory: .work/t3code
        run: vp run build:desktop

      - name: Build Windows NSIS installer
        working-directory: .work/t3code
        run: |
          vp run dist:desktop:artifact \
            --platform win \
            --target nsis \
            --arch x64 \
            --build-version "${{ needs.resolve.outputs.version }}" \
            --skip-build \
            --verbose

      - name: Collect Windows artifacts
        run: |
          dest="$GITHUB_WORKSPACE/release/${FLAVOR}/${VERSION}"
          bash scripts/collect-windows-artifacts.sh \
            "$GITHUB_WORKSPACE/.work/t3code/release" \
            "$dest"
          bash scripts/write-provenance.sh "$dest/upstream-prs.txt"

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.flavor }}-windows-x64
          path: release/${{ inputs.flavor }}/${{ needs.resolve.outputs.version }}/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the Windows installer
    needs: [resolve, build]
    if: needs.resolve.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.flavor }}-windows-x64
          path: artifacts
      - name: Upload the rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: ${{ inputs.flavor }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: bash scripts/publish-github-release.sh artifacts
      - name: Record successful build
        env:
          KEY: ${{ needs.resolve.outputs.key }}
          GITHUB_TOKEN: ${{ github.token }}
          FLAVOR: ${{ inputs.flavor }}
        run: bash scripts/record-last-built-key.sh "$FLAVOR" "$KEY"
